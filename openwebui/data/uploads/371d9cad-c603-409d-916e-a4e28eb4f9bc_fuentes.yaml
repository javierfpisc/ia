- fuente: "IETF RFC 6613 – RADIUS over TCP"
  descripcion: "Define el transporte de RADIUS sobre TCP en lugar del transporte UDP tradicional. Es una referencia complementaria para comprender las alternativas de transporte del protocolo."
  url: "https://www.rfc-editor.org/rfc/rfc6613.html"

- fuente: "IANA – RADIUS Attribute Types Registry"
  descripcion: "Registro oficial de tipos de paquetes, atributos y valores asociados al protocolo RADIUS. Es una referencia esencial para interpretar capturas de tráfico, configurar servidores AAA y estudiar extensiones del protocolo."
  url: "https://www.iana.org/assignments/radius-types/radius-types.xhtml"

# ============================================================
# 15. FRAMEWORK EAP: EXTENSIBLE AUTHENTICATION PROTOCOL
# ============================================================

