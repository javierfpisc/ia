- fuente: "Linux man-pages – pam.d(5)"
  descripcion: "Manual técnico de los ficheros de configuración PAM, normalmente ubicados en /etc/pam.d/. Explica los tipos de módulos, controles de ejecución y apilamiento de reglas."
