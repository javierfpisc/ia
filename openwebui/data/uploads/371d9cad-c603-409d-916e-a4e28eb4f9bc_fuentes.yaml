# ============================================================
# 9. CONTRASEÑAS DE UN SOLO USO: HOTP Y TOTP
# ============================================================

- fuente: "IETF RFC 6238 – TOTP: Time-Based One-Time Password Algorithm"
  descripcion: "Especificación del algoritmo TOTP, que genera contraseñas de un solo uso basadas en el tiempo. Es la base técnica de numerosos autenticadores software y sistemas de códigos temporales."
