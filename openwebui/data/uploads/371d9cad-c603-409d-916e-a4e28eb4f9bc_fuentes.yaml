- fuente: "IETF RFC 6749 – The OAuth 2.0 Authorization Framework"
  descripcion: "Especificación del marco de autorización OAuth 2.0. Define cómo una aplicación puede obtener acceso limitado a recursos protegidos en nombre de un usuario. Debe estudiarse junto con OpenID Connect para distinguir autorización y autenticación."
  url: "https://www.rfc-editor.org/rfc/rfc6749.html"

- fuente: "IETF RFC 8446 – The Transport Layer Security (TLS) Protocol Version 1.3"
  descripcion: "Especificación de TLS 1.3, protocolo que protege los canales de comunicación utilizados durante numerosos procesos de autenticación y permite autenticar servidores y, opcionalmente, clientes mediante certificados."
  url: "https://www.rfc-editor.org/rfc/rfc8446.html"

# ============================================================
# 12. ARQUITECTURA AAA: AUTHENTICATION, AUTHORIZATION, ACCOUNTING
# ============================================================

- fuente: "IETF RFC 6733 – Diameter Base Protocol"
  descripcion: "Especificación del protocolo Diameter, un framework AAA para autenticación, autorización y contabilidad. Describe arquitectura, mensajes, atributos, transporte, seguridad y aplicaciones de AAA en redes y servicios de movilidad."
  url: "https://www.rfc-editor.org/rfc/rfc6733.html"

- fuente: "IETF RFC 2903 – Generic AAA Architecture"
  descripcion: "Documento de arquitectura genérica AAA. Explica los conceptos fundamentales de autenticación, autorización y contabilidad, así como las relaciones entre clientes, servidores y servicios AAA."
  url: "https://www.rfc-editor.org/rfc/rfc2903.html"

- fuente: "IETF RFC 3539 – Authentication, Authorization and Accounting (AAA) Transport Profile"
  descripcion: "Define requisitos y consideraciones para el transporte de protocolos AAA, incluyendo fiabilidad, seguridad, control de congestión y gestión de conexiones."
  url: "https://www.rfc-editor.org/rfc/rfc3539.html"

- fuente: "IETF RFC 2865 – Remote Authentication Dial In User Service (RADIUS)"
  descripcion: "Especificación fundamental de RADIUS. Define el intercambio de mensajes entre un servidor de acceso a la red (NAS) y un servidor de autenticación centralizado. Incluye Access-Request, Access-Accept, Access-Reject y atributos."
  url: "https://www.rfc-editor.org/rfc/rfc2865.html"

- fuente: "IETF RFC 2866 – RADIUS Accounting"
  descripcion: "Extensión de RADIUS para contabilidad y registro de sesiones. Define los mensajes Accounting-Request y Accounting-Response y permite registrar el inicio, finalización y duración de las conexiones."
  url: "https://www.rfc-editor.org/rfc/rfc2866.html"

- fuente: "IETF RFC 5080 – Common RADIUS Implementation Issues and Suggested Fixes"
  descripcion: "Identifica problemas habituales de implementación de RADIUS y proporciona recomendaciones para mejorar la interoperabilidad, seguridad y funcionamiento de los servidores y clientes."
  url: "https://www.rfc-editor.org/rfc/rfc5080.html"

- fuente: "IETF RFC 6929 – RADIUS Protocol Extensions"
  descripcion: "Amplía RADIUS mediante nuevos mecanismos de representación de atributos, atributos extendidos y estructuras de datos más complejas."
  url: "https://www.rfc-editor.org/rfc/rfc6929.html"

- fuente: "IETF RFC 8044 – Data Types in RADIUS"
  descripcion: "Define tipos de datos y reglas de representación para atributos RADIUS, facilitando la interoperabilidad entre implementaciones."
  url: "https://www.rfc-editor.org/rfc/rfc8044.html"

- fuente: "IETF RFC 5176 – Dynamic Authorization Extensions to RADIUS"
  descripcion: "Define mecanismos para modificar dinámicamente las autorizaciones de una sesión RADIUS ya establecida. Incluye Disconnect-Request y CoA (Change of Authorization), utilizados para desconectar usuarios o modificar sus políticas de acceso."
  url: "https://www.rfc-editor.org/rfc/rfc5176.html"

- fuente: "IETF RFC 9765 – RADIUS/1.1"
  descripcion: "Especificación de RADIUS/1.1, que utiliza negociación mediante ALPN para eliminar la dependencia de MD5 del protocolo RADIUS tradicional. Referencia importante para conocer la evolución de la seguridad de RADIUS."
  url: "https://www.rfc-editor.org/rfc/rfc9765.html"

