# ============================================================
# 14. SEGURIDAD DEL TRANSPORTE RADIUS
# ============================================================

- fuente: "IETF RFC 6614 – Transport Layer Security (TLS) Encryption for RADIUS"
  descripcion: "Define el transporte de RADIUS sobre TLS, conocido habitualmente como RadSec. Permite proteger las comunicaciones entre servidores y clientes RADIUS mediante certificados y canales TLS."
  url: "https://www.rfc-editor.org/rfc/rfc6614.html"

- fuente: "IETF RFC 7360 – Datagram Transport Layer Security (DTLS) as a Transport Layer for RADIUS"
  descripcion: "Especifica el uso de DTLS como mecanismo de protección de las comunicaciones RADIUS sobre datagramas. Permite añadir confidencialidad e integridad al transporte UDP."
