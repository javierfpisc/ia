  descripcion: "Define el framework SASL, que permite incorporar mecanismos de autenticación a protocolos orientados a conexión. Se utiliza, entre otros, en LDAP y otros servicios de red."
  url: "https://www.rfc-editor.org/rfc/rfc4422.html"

