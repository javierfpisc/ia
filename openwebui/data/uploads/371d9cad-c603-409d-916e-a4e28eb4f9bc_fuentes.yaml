- fuente: "IETF RFC 5448 – Improved EAP-AKA Authentication"
  descripcion: "Define EAP-AKA', una evolución de EAP-AKA que incorpora mejoras en la derivación de claves y vinculación criptográfica del contexto de autenticación."
  url: "https://www.rfc-editor.org/rfc/rfc5448.html"

- fuente: "IETF RFC 4851 – EAP-FAST"
  descripcion: "Documentación del método EAP-FAST para autenticación mediante túneles protegidos. Se incluye también en el apartado de métodos EAP basados en TLS por su relevancia arquitectónica."
  url: "https://www.rfc-editor.org/rfc/rfc4851.html"

- fuente: "IETF RFC 5433 – Generic Pre-Shared Key (EAP-GPSK) Method"
  descripcion: "Especifica un método EAP basado en claves precompartidas. Incluye mecanismos de autenticación mutua y derivación de claves sin necesidad de certificados digitales."
  url: "https://www.rfc-editor.org/rfc/rfc5433.html"

- fuente: "IETF RFC 5931 – Extensible Authentication Protocol (EAP) Authentication Using Only a Password"
  descripcion: "Define EAP-PWD, un método EAP basado en contraseñas que utiliza técnicas criptográficas para establecer una autenticación mutua y derivar claves de sesión."
  url: "https://www.rfc-editor.org/rfc/rfc5931.html"

- fuente: "IETF RFC 3748 – EAP-MD5 Challenge"
  descripcion: "Describe el método EAP-MD5 como parte del framework EAP original. Su interés es principalmente histórico y didáctico, ya que no proporciona autenticación mutua ni protección suficiente frente a determinados ataques y no debe utilizarse como mecanismo moderno de autenticación."
  url: "https://www.rfc-editor.org/rfc/rfc3748.html"

