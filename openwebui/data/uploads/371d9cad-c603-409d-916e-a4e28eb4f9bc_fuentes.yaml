- fuente: "OWASP – Multifactor Authentication Cheat Sheet"
  descripcion: "Explica los factores de autenticación (conocimiento, posesión e inherencia), los mecanismos MFA, su independencia, los riesgos de implementación y las recomendaciones de seguridad."
