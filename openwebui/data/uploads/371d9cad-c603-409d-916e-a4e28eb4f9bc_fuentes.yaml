- fuente: "CISA – Implementing Phishing-Resistant MFA"
  descripcion: "Recomendaciones de la agencia estadounidense de ciberseguridad para implantar autenticación multifactor resistente al phishing. Explica las ventajas de FIDO/WebAuthn y los riesgos de métodos tradicionales."
  url: "https://www.cisa.gov/resources-tools/resources/implementing-phishing-resistant-mfa"

- fuente: "NIST – Authentication and Authenticator Management"
  descripcion: "Documentación técnica sobre los tipos de autenticadores, sus características, los factores de autenticación y los requisitos de seguridad de los distintos mecanismos."
  url: "https://pages.nist.gov/800-63-4/sp800-63b.html"

# ============================================================
# 4. GESTIÓN DE CONTRASEÑAS Y PROTECCIÓN DE CREDENCIALES
# ============================================================

- fuente: "NIST SP 800-63B-4 – Password Authenticators"
  descripcion: "Requisitos y recomendaciones sobre contraseñas: longitud, listas de contraseñas comprometidas, almacenamiento seguro, verificación, limitación de intentos y protección frente a ataques."
  url: "https://pages.nist.gov/800-63-4/sp800-63b/authenticators/"

- fuente: "OWASP – Password Storage Cheat Sheet"
  descripcion: "Buenas prácticas para almacenar contraseñas de forma segura. Trata algoritmos de derivación y hash como Argon2id, bcrypt y PBKDF2, sal única, factores de coste y protección frente a ataques offline."
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"

- fuente: "OWASP – Forgot Password Cheat Sheet"
  descripcion: "Recomendaciones para los procesos de recuperación y restablecimiento de contraseñas, emisión y validación de tokens, protección frente a enumeración de cuentas y gestión de sesiones."
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html"

- fuente: "OWASP – Credential Stuffing Prevention Cheat Sheet"
  descripcion: "Explica los ataques de reutilización automatizada de credenciales obtenidas en filtraciones y las medidas de protección frente a ellos."
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html"

- fuente: "OWASP – Authentication Cheat Sheet: Passwords"
  descripcion: "Recomendaciones para la validación de contraseñas, prevención de ataques de fuerza bruta, limitación de intentos y protección de los mecanismos de inicio de sesión."
  url: "https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html"

# ============================================================
# 5. AUTENTICACIÓN EN LINUX
# ============================================================

- fuente: "Linux-PAM – The Linux-PAM System Administrators' Guide"
  descripcion: "Documentación oficial de Linux-PAM sobre la arquitectura de módulos de autenticación conectables. Explica la configuración de los servicios de autenticación, las pilas de módulos y los mecanismos auth, account, password y session."
