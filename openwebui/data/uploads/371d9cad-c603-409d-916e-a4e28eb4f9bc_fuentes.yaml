  descripcion: "Especificación fundamental del framework EAP. Define la arquitectura de autenticación extensible, los roles de peer, authenticator y authentication server, los tipos de mensajes y el funcionamiento de los métodos de autenticación."
  url: "https://www.rfc-editor.org/rfc/rfc3748.html"

- fuente: "IETF RFC 5247 – Extensible Authentication Protocol (EAP) Key Management Framework"
  descripcion: "Define el framework de gestión de claves de EAP, incluyendo derivación, distribución y utilización de material criptográfico generado durante los procesos de autenticación."
  url: "https://www.rfc-editor.org/rfc/rfc5247.html"

- fuente: "IANA – EAP Method Types Registry"
  descripcion: "Registro oficial de tipos de métodos EAP asignados. Permite consultar los identificadores y las especificaciones asociadas a los distintos métodos de autenticación EAP."
  url: "https://www.iana.org/assignments/eap-numbers/eap-numbers.xhtml"

# ============================================================
# 16. MÉTODOS EAP BASADOS EN CERTIFICADOS Y TÚNELES TLS
# ============================================================

- fuente: "IETF RFC 5216 – The EAP-TLS Authentication Protocol"
  descripcion: "Especificación del método EAP-TLS, que utiliza certificados digitales y TLS para realizar autenticación mutua entre cliente y servidor. Es uno de los métodos EAP más sólidos y adecuados para autenticación de dispositivos y usuarios mediante certificados."
  url: "https://www.rfc-editor.org/rfc/rfc5216.html"

- fuente: "IETF RFC 9190 – EAP-TLS 1.3"
  descripcion: "Actualización de EAP-TLS para utilizar TLS 1.3. Incorpora mejoras de seguridad, confidencialidad, secreto hacia adelante y protección de la identidad del usuario."
  url: "https://www.rfc-editor.org/rfc/rfc9190.html"

- fuente: "IETF RFC 9427 – TLS-Based Extensible Authentication Protocol (EAP) Types for Use with TLS 1.3"
  descripcion: "Describe las consideraciones y adaptaciones necesarias para utilizar TLS 1.3 en métodos EAP basados en TLS, incluyendo EAP-TLS, EAP-TTLS, EAP-FAST y TEAP."
  url: "https://www.rfc-editor.org/rfc/rfc9427.html"

- fuente: "IETF RFC 5281 – EAP Tunneled TLS Authentication Protocol (EAP-TTLS)"
  descripcion: "Especificación de EAP-TTLS. Utiliza un túnel TLS para proteger el intercambio de credenciales y permitir métodos de autenticación internos dentro del túnel seguro."
  url: "https://www.rfc-editor.org/rfc/rfc5281.html"

- fuente: "IETF RFC 4851 – The Flexible Authentication via Secure Tunneling (EAP-FAST) Protocol"
  descripcion: "Define EAP-FAST, un método EAP que establece un túnel TLS protegido mediante credenciales PAC o certificados y permite realizar autenticación interna dentro del túnel."
  url: "https://www.rfc-editor.org/rfc/rfc4851.html"

- fuente: "IETF RFC 7170 – Tunnel Extensible Authentication Protocol (TEAP) Version 1"
  descripcion: "Define TEAP, un método EAP basado en túneles TLS que permite realizar varias operaciones de autenticación y vincular credenciales dentro de una misma sesión protegida."
  url: "https://www.rfc-editor.org/rfc/rfc7170.html"

- fuente: "Microsoft – Protected Extensible Authentication Protocol (PEAP)"
  descripcion: "Documentación técnica sobre PEAP, método de autenticación EAP basado en un túnel TLS. Explica su utilización con certificados de servidor y mecanismos de autenticación internos como EAP-MSCHAPv2."
  url: "https://learn.microsoft.com/en-us/windows-server/networking/technologies/extensible-authentication-protocol/network-access"

# ============================================================
# 17. OTROS MÉTODOS EAP
# ============================================================

- fuente: "IETF RFC 4186 – Extensible Authentication Protocol Method for GSM Subscriber Identity Modules (EAP-SIM)"
  descripcion: "Define EAP-SIM, un método EAP basado en los mecanismos de autenticación de tarjetas SIM GSM. Permite utilizar credenciales de identidad móvil en procesos de autenticación de red."
