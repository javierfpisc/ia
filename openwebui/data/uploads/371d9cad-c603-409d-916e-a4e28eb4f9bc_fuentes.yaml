- fuente: "IETF RFC 4187 – EAP-AKA Authentication"
  descripcion: "Define EAP-AKA, un método EAP basado en mecanismos de autenticación y acuerdo de claves de sistemas móviles 3G. Utiliza credenciales de tarjetas USIM."
