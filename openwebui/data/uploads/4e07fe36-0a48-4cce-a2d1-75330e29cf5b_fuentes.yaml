# ============================================================
# 23. CLOUD NATIVE: FUNDAMENTOS Y ECOSISTEMA CNCF
# ============================================================

- fuente: "Cloud Native Computing Foundation (CNCF)"
  descripcion: "Organización de referencia del ecosistema cloud native, perteneciente a The Linux Foundation. Promueve y mantiene proyectos de código abierto relacionados con la orquestación de contenedores, automatización, observabilidad, redes, almacenamiento, seguridad y despliegue de aplicaciones. Referencia principal para introducir el ecosistema tecnológico alrededor de Kubernetes."
  url: "https://www.cncf.io/"

- fuente: "CNCF – Cloud Native Landscape"
  descripcion: "Mapa del ecosistema cloud native que recoge proyectos, productos y tecnologías organizados por categorías funcionales. Permite identificar las principales herramientas utilizadas en entornos Kubernetes, incluyendo redes, almacenamiento, observabilidad, seguridad, CI/CD, service mesh y automatización de infraestructura. Es una referencia especialmente útil para comprender la amplitud del ecosistema."
  url: "https://landscape.cncf.io/"

- fuente: "CNCF – Projects"
  descripcion: "Catálogo oficial de proyectos de la CNCF, organizados según su nivel de madurez: Graduated, Incubating y Sandbox. Permite identificar los proyectos que forman parte de la fundación, su ámbito funcional y su evolución dentro del ecosistema cloud native."
  url: "https://www.cncf.io/projects/"

- fuente: "CNCF – Project Lifecycle"
  descripcion: "Descripción del ciclo de vida y los niveles de madurez de los proyectos de la CNCF. Explica los criterios de entrada y evolución de los proyectos desde Sandbox hasta Incubating y Graduated, así como la categoría Archived. Referencia para comprender los mecanismos de gobernanza y madurez del software cloud native."
  url: "https://contribute.cncf.io/projects/lifecycle/"

- fuente: "CNCF – Cloud Native Trail Map"
  descripcion: "Guía de referencia que propone un recorrido de adopción de tecnologías cloud native. Presenta las principales categorías tecnológicas y una secuencia de incorporación de herramientas y prácticas para construir plataformas modernas de desarrollo y despliegue de aplicaciones."
  url: "https://github.com/cncf/trailmap"

- fuente: "The Linux Foundation – Cloud Native"
  descripcion: "Recursos formativos y documentación sobre tecnologías cloud native, Kubernetes, contenedores, automatización, DevOps y plataformas distribuidas. Permite contextualizar la evolución de las arquitecturas tradicionales hacia infraestructuras basadas en servicios y aplicaciones desacopladas."
  url: "https://www.linuxfoundation.org/"


# ============================================================
# 24. KUBERNETES: FUNDAMENTOS, ARQUITECTURA Y COMPONENTES
# ============================================================

- fuente: "Kubernetes – Documentación oficial"
  descripcion: "Documentación oficial del proyecto Kubernetes, mantenido por la comunidad Kubernetes y la CNCF. Referencia principal para estudiar la plataforma de orquestación de contenedores, su arquitectura, recursos, APIs, administración, seguridad y despliegue de aplicaciones."
  url: "https://kubernetes.io/docs/"

- fuente: "Kubernetes – Concepts"
  descripcion: "Introducción a los conceptos fundamentales de Kubernetes. Explica la arquitectura de clústeres, Pods, Workloads, Deployments, StatefulSets, DaemonSets, Services, almacenamiento, configuración, seguridad, políticas y mecanismos de planificación."
  url: "https://kubernetes.io/docs/concepts/"

- fuente: "Kubernetes – Cluster Architecture"
  descripcion: "Descripción de la arquitectura de un clúster Kubernetes. Explica la separación entre control plane y worker nodes, así como las funciones de kube-apiserver, etcd, kube-scheduler, kube-controller-manager, kubelet y kube-proxy. Referencia esencial para comprender el funcionamiento interno del orquestador."
  url: "https://kubernetes.io/docs/concepts/architecture/"

- fuente: "Kubernetes – Components"
  descripcion: "Referencia de los componentes principales que integran un clúster Kubernetes, sus responsabilidades y las relaciones entre ellos. Permite estudiar la arquitectura de control y ejecución de cargas de trabajo."
  url: "https://kubernetes.io/docs/concepts/overview/components/"

- fuente: "Kubernetes – Workloads"
  descripcion: "Documentación sobre los recursos que permiten ejecutar aplicaciones en Kubernetes. Explica Pods, ReplicaSets, Deployments, StatefulSets, DaemonSets, Jobs y CronJobs, así como sus características y escenarios de utilización."
  url: "https://kubernetes.io/docs/concepts/workloads/"

- fuente: "Kubernetes – Services, Load Balancing and Networking"
  descripcion: "Documentación sobre los mecanismos de comunicación entre aplicaciones y servicios dentro y fuera del clúster. Explica Services, ClusterIP, NodePort, LoadBalancer, DNS, balanceo de tráfico y fundamentos de la conectividad de red."
  url: "https://kubernetes.io/docs/concepts/services-networking/"

- fuente: "Kubernetes – Storage"
  descripcion: "Documentación sobre el almacenamiento persistente y temporal de las aplicaciones. Introduce Volumes, PersistentVolumes, PersistentVolumeClaims, StorageClasses, aprovisionamiento dinámico y la integración con sistemas de almacenamiento externos."
  url: "https://kubernetes.io/docs/concepts/storage/"

- fuente: "Kubernetes – Configuration"
  descripcion: "Referencia sobre los mecanismos de configuración de aplicaciones en Kubernetes. Explica ConfigMaps, Secrets, variables de entorno, volúmenes de configuración y otros mecanismos para desacoplar la configuración del ciclo de vida de las aplicaciones."
  url: "https://kubernetes.io/docs/concepts/configuration/"

- fuente: "Kubernetes – Cluster Administration"
  descripcion: "Documentación orientada a la administración de clústeres Kubernetes. Incluye gestión de nodos, recursos, certificados, componentes del sistema, monitorización, políticas, mantenimiento y operaciones administrativas."
  url: "https://kubernetes.io/docs/concepts/cluster-administration/"

- fuente: "Kubernetes – kubectl"
  descripcion: "Documentación de la herramienta de línea de comandos kubectl, utilizada para interactuar con la API de Kubernetes. Explica la consulta y modificación de recursos, aplicación de manifiestos YAML, gestión de contextos, depuración y operaciones administrativas."
  url: "https://kubernetes.io/docs/reference/kubectl/"

- fuente: "Kubernetes – API Reference"
  descripcion: "Referencia técnica de la API de Kubernetes. Describe los recursos disponibles, sus propiedades, versiones y operaciones. Permite consultar la estructura de los manifiestos y comprender la interacción entre los clientes y el API Server."
  url: "https://kubernetes.io/docs/reference/kubernetes-api/"

- fuente: "Kubernetes – Resource Management"
  descripcion: "Documentación sobre la asignación y limitación de recursos computacionales. Explica requests, limits, cuotas, LimitRanges y mecanismos para controlar el consumo de CPU y memoria de las aplicaciones."
  url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"


