  descripcion: "Documentación del sistema de almacenamiento distribuido Ceph. Explica su arquitectura, almacenamiento de bloques mediante RBD, almacenamiento de objetos mediante RGW y sistemas de archivos distribuidos mediante CephFS. Referencia para comprender la infraestructura de almacenamiento que puede integrarse con Kubernetes."
  url: "https://docs.ceph.com/en/latest/"

- fuente: "Longhorn – Documentación oficial"
  descripcion: "Documentación de Longhorn, solución de almacenamiento distribuido para Kubernetes. Explica la creación y administración de volúmenes persistentes, replicación entre nodos, snapshots, backups y mecanismos de recuperación."
  url: "https://longhorn.io/docs/"


