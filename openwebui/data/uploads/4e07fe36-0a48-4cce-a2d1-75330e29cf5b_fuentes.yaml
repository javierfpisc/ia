  descripcion: "Procedimiento oficial para instalar kubeadm, kubelet y kubectl en los nodos de un clúster. Explica los requisitos previos y la preparación de los sistemas operativos para desplegar Kubernetes mediante kubeadm."
  url: "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/install-kubeadm/"

- fuente: "Kubernetes – Bootstrapping Clusters with kubeadm"
  descripcion: "Guía de referencia para crear clústeres Kubernetes mediante kubeadm. Explica la inicialización del control plane, incorporación de nodos worker, configuración de certificados, alta disponibilidad y actualización del clúster."
  url: "https://kubernetes.io/docs/setup/production-environment/tools/kubeadm/"

- fuente: "Kubernetes – Container Runtimes"
  descripcion: "Documentación sobre los entornos de ejecución de contenedores compatibles con Kubernetes. Explica la relación entre kubelet, Container Runtime Interface (CRI) y runtimes como containerd y CRI-O, así como los requisitos de configuración."
  url: "https://kubernetes.io/docs/setup/production-environment/container-runtimes/"

- fuente: "K3s – Documentación oficial"
  descripcion: "Documentación de K3s, distribución ligera y certificada de Kubernetes desarrollada por SUSE/Rancher. Explica su arquitectura, instalación, configuración, administración, alta disponibilidad y componentes integrados. Especialmente interesante para laboratorios, edge computing, IoT y despliegues con recursos limitados."
  url: "https://docs.k3s.io/"

- fuente: "K3s – Quick Start"
  descripcion: "Guía de instalación rápida de K3s. Describe el despliegue de un servidor Kubernetes y la incorporación de nodos adicionales, así como los primeros pasos para administrar el clúster."
  url: "https://docs.k3s.io/quick-start"

- fuente: "K3s – Architecture"
  descripcion: "Explicación de la arquitectura de K3s y de sus componentes. Describe el funcionamiento de los nodos server y agent, los servicios integrados, el datastore y las diferencias respecto a una instalación Kubernetes convencional."
  url: "https://docs.k3s.io/architecture"

- fuente: "RKE2 – Documentación oficial"
  descripcion: "Documentación de RKE2, distribución Kubernetes orientada a entornos empresariales y seguridad. Explica su instalación, arquitectura, configuración, administración y mecanismos de endurecimiento de la plataforma."
  url: "https://docs.rke2.io/"

- fuente: "Cluster API – Documentación oficial"
  descripcion: "Proyecto de la comunidad Kubernetes para gestionar el ciclo de vida de clústeres mediante APIs declarativas. Permite automatizar la creación, configuración, actualización y eliminación de clústeres Kubernetes sobre diferentes proveedores de infraestructura."
  url: "https://cluster-api.sigs.k8s.io/"

- fuente: "Kubespray – Documentación oficial"
  descripcion: "Proyecto basado en Ansible para desplegar y administrar clústeres Kubernetes en diferentes entornos. Permite estudiar la integración entre automatización de infraestructura, configuración de sistemas y despliegue del orquestador."
  url: "https://kubespray.io/"


# ============================================================
# 26. REDES KUBERNETES: CNI, CILIUM, CALICO Y COREDNS
# ============================================================

- fuente: "Kubernetes – Cluster Networking"
  descripcion: "Explicación del modelo de red de Kubernetes y de los mecanismos necesarios para permitir la comunicación entre Pods, nodos, servicios y redes externas. Introduce los requisitos de conectividad y el papel de los plugins de red."
  url: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- fuente: "Kubernetes – Network Plugins"
  descripcion: "Documentación sobre los plugins de red que implementan el modelo de conectividad de Kubernetes. Explica el papel de CNI y la necesidad de disponer de una implementación compatible para proporcionar conectividad entre Pods."
  url: "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"

- fuente: "CNI – Container Network Interface Specification"
  descripcion: "Especificación oficial de la interfaz de red para contenedores. Define el protocolo de comunicación entre los runtimes y los plugins de red, así como las operaciones necesarias para configurar y eliminar interfaces de red."
  url: "https://github.com/containernetworking/cni/blob/main/SPEC.md"

- fuente: "Cilium – Documentación oficial"
  descripcion: "Documentación de Cilium, solución de conectividad, seguridad y observabilidad para entornos Kubernetes basada en eBPF. Explica la arquitectura de red, políticas de seguridad, balanceo de servicios, integración con Gateway API y monitorización del tráfico."
  url: "https://docs.cilium.io/en/stable/"

- fuente: "Cilium – Getting Started"
  descripcion: "Guía de iniciación a Cilium. Explica su instalación en Kubernetes, configuración de red, utilización de eBPF y comprobación de la conectividad entre aplicaciones."
  url: "https://docs.cilium.io/en/stable/gettingstarted/"

- fuente: "Calico – Documentación oficial"
  descripcion: "Documentación de Calico, plataforma de red y seguridad para Kubernetes. Explica la implementación de redes de Pods, políticas de red, enrutamiento, conectividad entre nodos y mecanismos de aislamiento de tráfico."
  url: "https://docs.tigera.io/calico/latest/about/"

- fuente: "Calico – Network Policy"
  descripcion: "Guía sobre la implementación de políticas de red en Kubernetes. Explica cómo controlar el tráfico de entrada y salida mediante selectores, namespaces, etiquetas y reglas de acceso. Permite introducir la segmentación de red y el principio de mínimo privilegio en entornos de contenedores."
  url: "https://docs.tigera.io/calico/latest/network-policy/"

- fuente: "CoreDNS – Documentación oficial"
  descripcion: "Documentación de CoreDNS, servidor DNS extensible utilizado habitualmente en Kubernetes para proporcionar resolución de nombres y descubrimiento de servicios. Explica su arquitectura, configuración, plugins e integración con el DNS interno del clúster."
  url: "https://coredns.io/manual/toc/"


# ============================================================
# 27. EXPOSICIÓN DE SERVICIOS: INGRESS, GATEWAY API Y LOAD BALANCING
# ============================================================

- fuente: "Kubernetes – Ingress"
  descripcion: "Documentación oficial del recurso Ingress. Explica cómo publicar servicios HTTP y HTTPS mediante reglas de encaminamiento basadas en nombres de host y rutas. Introduce los conceptos de terminación TLS y exposición de aplicaciones. La API Ingress está estabilizada y congelada; Kubernetes recomienda estudiar también Gateway API para nuevas funcionalidades."
  url: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- fuente: "Kubernetes – Ingress Controllers"
  descripcion: "Catálogo y explicación de los controladores necesarios para implementar recursos Ingress. Describe el papel de los controladores en la recepción, procesamiento y encaminamiento del tráfico externo hacia los servicios internos."
  url: "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"

- fuente: "Kubernetes SIG Network – Gateway API"
  descripcion: "Proyecto oficial de Kubernetes orientado a proporcionar una API más expresiva y extensible para el encaminamiento de tráfico. Introduce GatewayClass, Gateway, HTTPRoute y otros recursos, así como la separación de responsabilidades entre operadores de infraestructura y desarrolladores de aplicaciones."
  url: "https://gateway-api.sigs.k8s.io/"

- fuente: "Gateway API – Introduction"
  descripcion: "Introducción conceptual a Gateway API. Explica su modelo de recursos, objetivos de diseño, relación con Ingress y posibilidades de gestión del tráfico de entrada y comunicación entre servicios."
  url: "https://gateway-api.sigs.k8s.io/docs/introduction/"

- fuente: "Gateway API – API Overview"
  descripcion: "Referencia sobre los recursos y conceptos de Gateway API. Describe GatewayClass, Gateway, Routes y los distintos roles que intervienen en la administración del tráfico de red de un clúster."
  url: "https://gateway-api.sigs.k8s.io/docs/concepts/api-overview/"

- fuente: "MetalLB – Documentación oficial"
  descripcion: "Documentación de MetalLB, implementación de balanceo de servicios de tipo LoadBalancer para clústeres Kubernetes que no disponen de un proveedor cloud que proporcione esta funcionalidad. Especialmente útil para despliegues bare metal y laboratorios on-premises."
  url: "https://metallb.io/"

- fuente: "Traefik Proxy – Kubernetes Documentation"
  descripcion: "Documentación del proxy Traefik y su integración con Kubernetes mediante Ingress, CRDs y Gateway API. Permite estudiar la publicación de aplicaciones, encaminamiento HTTP, terminación TLS y gestión de tráfico externo."
  url: "https://doc.traefik.io/traefik/"

- fuente: "NGINX – Kubernetes Ingress and Gateway"
  descripcion: "Documentación sobre las soluciones NGINX para publicar servicios en Kubernetes, incluyendo controladores Ingress, implementaciones de Gateway API y mecanismos de migración. Útil para estudiar alternativas de exposición de aplicaciones y la evolución del ecosistema Ingress."
  url: "https://kubernetes.nginx.org/"


