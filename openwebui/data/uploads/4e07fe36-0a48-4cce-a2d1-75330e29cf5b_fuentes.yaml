  descripcion: "Referencia sobre StorageClasses y los mecanismos para definir diferentes tipos de almacenamiento disponibles en un clúster. Explica parámetros de aprovisionamiento, provisioners, políticas de recuperación y modos de vinculación de volúmenes."
  url: "https://kubernetes.io/docs/concepts/storage/storage-classes/"

