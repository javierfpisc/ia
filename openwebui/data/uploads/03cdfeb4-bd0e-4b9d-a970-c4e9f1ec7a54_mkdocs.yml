    - 1.6 · Gestión de la red en Proxmox: contenidos/unidades/01/6-network.md
    - 1.7 · Implementación de HA en Proxmox: contenidos/unidades/01/7-ha.md
    - 1.8 · Seguridad en Proxmox VE. Enfoque RBAC: contenidos/unidades/01/8-seguridad.md
