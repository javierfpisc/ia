site_name: Materiales DPEC (vista previa local)
site_description: Vista previa local de contenidos y prácticas del módulo de Despliegue de Plataformas de Ejecución de Contenedores (DPEC)
docs_dir: /docs
site_dir: /tmp/site
use_directory_urls: true

# instrucciones.txt de contenidos/ y practicas/ son enlaces a ../../ que no existen dentro de los volúmenes montados.
exclude_docs: |
  *.txt

theme:
  name: material
  language: es

plugins:
  - search:
      lang: es
  - awesome-pages

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Navegación explícita generada a partir de contenidos/unidades.yml
nav:
- Inicio: index.md
- Sistema de generación: sistema.md
- Contenidos:
  - Unidad 0 · Introducción al módulo:
    - '0.1 · Resumen del Módulo Profesional: Despliegue de Plataformas de Ejecución de Contenedores': contenidos/unidades/00/1-aspectos-legales-modulo.md
    - '0.2 · Guía del Entorno de Prácticas: Infraestructura y Herramientas de Trabajo': contenidos/unidades/00/2-entorno-trabajo.md
