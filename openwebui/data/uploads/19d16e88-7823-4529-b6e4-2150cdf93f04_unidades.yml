          - "Levantar las 3 máquinas con vagrant up"
          - "Comprobar el acceso SSH a cada nodo"
        entregables: ["Registro de vagrant status con los 3 nodos operativos"]
        comprobaciones: ["Los 3 nodos arrancan correctamente", "Se puede acceder por SSH a cada nodo"]
