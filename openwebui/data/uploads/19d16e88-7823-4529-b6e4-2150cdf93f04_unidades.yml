        sesiones: 2
        palabras: 778
        fuentes: documentacion/unidad1-virtualizacion
        aspectos:
          - "Aprovisionamiento automatizado de máquinas virtuales con Vagrant y VirtualBox"
          - "Estructura de un Vagrantfile multi-máquina"
        minimos:
          - "Levantar el entorno de 3 nodos con vagrant up"
          - "Acceder por SSH a cada nodo desplegado"
        diagramas: 0
        escenario:
          tipo: otro
          modalidad: ejecutable
          descripcion: "Entorno base de 3 nodos (pve1, pve2, pve3) desplegado con Vagrant sobre VirtualBox; sirve de punto de partida para el resto de prácticas de la unidad."
          artefactos: "vagrant"
          requisitos: ["Vagrant", "VirtualBox"]
          dispositivos: ["pve1", "pve2", "pve3"]
          servicios: []
          topologia: "3 nodos en red privada VirtualBox"
          direccionamiento: ["pve1: 192.168.56.11/24", "pve2: 192.168.56.12/24", "pve3: 192.168.56.13/24"]
          operaciones:
            inicio: ["vagrant up"]
            parada: ["vagrant halt"]
            limpieza: ["vagrant destroy"]
            validacion: ["vagrant status", "vagrant ssh <nodo>"]
        procedimientos:
