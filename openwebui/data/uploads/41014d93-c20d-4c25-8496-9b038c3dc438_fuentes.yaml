
# ============================================================
# 1. ODOO 19 - DOCUMENTACIÓN OFICIAL Y ARQUITECTURA
# ============================================================

- fuente: "Odoo 19 – Documentación para desarrolladores"
  descripcion: "Portal principal de documentación técnica de Odoo 19. Incluye tutoriales, guías prácticas y referencias de API. Debe ser la fuente prioritaria para resolver dudas sobre el desarrollo de módulos."
  url: "https://www.odoo.com/documentation/19.0/developer.html"

- fuente: "Odoo 19 – Tutorial Server Framework 101"
  descripcion: "Tutorial oficial para aprender a desarrollar una aplicación completa en Odoo. Explica la arquitectura, estructura de módulos, modelos, campos, relaciones, seguridad, vistas, acciones, menús, lógica de negocio y pruebas. Es especialmente adecuado como guía pedagógica para construir módulos desde cero."
  url: "https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101.html"

- fuente: "Odoo 19 – Instalación desde código fuente"
  descripcion: "Documentación oficial para preparar un entorno de desarrollo desde los repositorios de código fuente. Describe requisitos de Python, PostgreSQL, dependencias, configuración y ejecución de Odoo. Permite comprender el entorno de ejecución utilizado en el laboratorio Docker."
  url: "https://www.odoo.com/documentation/19.0/administration/install/source.html"

- fuente: "Odoo 19 – Estructura y composición de los módulos"
  descripcion: "Referencia para comprender la organización de los addons, el archivo __manifest__.py, los archivos de inicialización, las dependencias y los diferentes directorios que componen un módulo de Odoo."
  url: "https://www.odoo.com/documentation/19.0/developer/tutorials/server_framework_101/01_architecture.html"

- fuente: "Odoo 19 – API ORM"
  descripcion: "Referencia técnica fundamental para desarrollar modelos de negocio. Describe Model, TransientModel y AbstractModel, recordsets, campos, relaciones, entornos, operaciones CRUD, herencia, campos calculados, restricciones, decoradores y ejecución de SQL."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html"

- fuente: "Odoo 19 – Referencia de campos del ORM"
  descripcion: "Documentación de los tipos de campos disponibles en los modelos de Odoo y sus atributos. Incluye campos básicos, relacionales, calculados, almacenados, propiedades de lectura y escritura, valores predeterminados y parámetros de configuración."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/orm.html#fields"

- fuente: "Odoo 19 – Sistema de vistas"
  descripcion: "Referencia para construir interfaces de administración mediante XML. Explica las vistas de formulario, lista, búsqueda, kanban, calendario y otras representaciones, así como la herencia y modificación de vistas existentes."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/user_interface/view_architectures.html"

- fuente: "Odoo 19 – Referencia de acciones"
  descripcion: "Documentación sobre las acciones que permiten ejecutar operaciones y navegar por la aplicación. Incluye acciones de ventana, acciones de servidor, acciones URL, informes y acciones automatizadas."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/actions.html"

- fuente: "Odoo 19 – Seguridad en el backend"
  descripcion: "Explica el sistema de seguridad de Odoo: usuarios, grupos, permisos de acceso, reglas de registro, restricciones por operación y mecanismos de control de acceso desde Python. Es esencial para desarrollar módulos seguros."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/security.html"

- fuente: "Odoo 19 – Archivos de datos XML y CSV"
  descripcion: "Referencia para declarar datos iniciales y registros mediante XML y CSV. Explica identificadores externos, operaciones de creación, actualización, referencias entre registros, orden de carga y funcionamiento de los archivos de datos."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/data.html"

- fuente: "Odoo 19 – Controladores HTTP"
  descripcion: "Documentación para desarrollar controladores web en Python. Explica las rutas HTTP, los métodos GET y POST, los parámetros, las respuestas, la autenticación, los tipos de contenido y la integración con el framework de Odoo."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/http.html"

- fuente: "Odoo 19 – Pruebas automatizadas"
  descripcion: "Guía para desarrollar pruebas unitarias e integradas de módulos. Incluye TransactionCase, HttpCase, pruebas de modelos, pruebas de controladores, etiquetas de ejecución y mecanismos para ejecutar las pruebas desde odoo-bin."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/testing.html"

- fuente: "Odoo 19 – Informes QWeb"
  descripcion: "Documentación para generar informes y documentos PDF mediante plantillas QWeb. Explica las acciones de informe, plantillas XML, variables, expresiones, herencia y generación de documentos."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/reports.html"

- fuente: "Odoo 19 – Sistema de correo y notificaciones"
  descripcion: "Referencia para integrar funcionalidades de comunicación en los módulos mediante el sistema de correo de Odoo. Incluye mensajes, seguidores, actividades, plantillas de correo y funcionalidades relacionadas con mail.thread y mail.activity.mixin."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/backend/mixins.html"

# ============================================================
# 2. ODOO - DESARROLLO DE INTERFAZ Y TECNOLOGÍAS WEB
# ============================================================

- fuente: "Odoo 19 – Desarrollo de interfaces web y assets"
  descripcion: "Documentación del sistema de recursos estáticos de Odoo. Explica la organización de JavaScript, CSS, SCSS y XML, los bundles de assets y su incorporación al manifiesto del módulo."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/frontend/assets.html"

- fuente: "Odoo 19 – Framework OWL"
  descripcion: "Referencia del framework de componentes utilizado por el cliente web de Odoo. Permite comprender componentes, plantillas, estado, hooks y ciclo de vida para desarrollar extensiones de interfaz cuando el módulo necesita funcionalidades frontend avanzadas."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/frontend/owl_components.html"

- fuente: "Odoo 19 – JavaScript API"
  descripcion: "Referencia de las APIs JavaScript del cliente web. Incluye servicios, acciones, registros, hooks y mecanismos de extensión del cliente web de Odoo."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/frontend/javascript_reference.html"

- fuente: "Odoo 19 – QWeb Templates"
  descripcion: "Documentación del motor de plantillas QWeb. Explica directivas, expresiones, estructuras de control, variables, llamadas a subplantillas y herencia de plantillas XML."
  url: "https://www.odoo.com/documentation/19.0/developer/reference/frontend/qweb.html"

# ============================================================
# 3. PYTHON - LENGUAJE Y PROGRAMACIÓN BACKEND
# ============================================================

- fuente: "Python – Documentación oficial"
  descripcion: "Documentación oficial del lenguaje Python. Referencia general para sintaxis, tipos de datos, estructuras de control, funciones, clases, módulos, excepciones, iteradores y programación orientada a objetos. Odoo 19 requiere Python 3.10 o superior, por lo que deben priorizarse las características compatibles con su entorno."
  url: "https://docs.python.org/3/"

- fuente: "Python – Tutorial oficial"
  descripcion: "Tutorial introductorio y de referencia sobre programación Python. Explica estructuras de datos, funciones, módulos, paquetes, entrada y salida, excepciones, clases y gestión de errores. Especialmente útil para alumnos que necesitan reforzar los fundamentos del lenguaje."
  url: "https://docs.python.org/3/tutorial/"

- fuente: "Python – Referencia del modelo de datos"
  descripcion: "Documentación avanzada sobre el modelo de objetos de Python. Explica clases, atributos, métodos, propiedades, descriptores, herencia, métodos especiales y funcionamiento interno de los objetos. Útil para comprender el diseño del ORM de Odoo."
  url: "https://docs.python.org/3/reference/datamodel.html"

- fuente: "Python – Biblioteca estándar"
  descripcion: "Referencia de la biblioteca estándar de Python. Incluye módulos para fechas, expresiones regulares, colecciones, archivos, serialización, estructuras de datos, procesamiento de texto, registros de actividad y otras funcionalidades aprovechables en módulos de Odoo."
  url: "https://docs.python.org/3/library/"

- fuente: "Python – Gestión de entornos virtuales"
  descripcion: "Documentación del módulo venv para crear entornos Python aislados. Permite comprender la separación de dependencias y la reproducibilidad de los entornos de desarrollo."
  url: "https://docs.python.org/3/library/venv.html"

- fuente: "Python – Tipado estático y anotaciones"
  descripcion: "Referencia del sistema de anotaciones de tipos de Python. Explica type hints, tipos genéricos, uniones y otras herramientas para mejorar la legibilidad, mantenimiento y análisis estático del código."
  url: "https://docs.python.org/3/library/typing.html"

- fuente: "Python – Logging"
  descripcion: "Documentación oficial del sistema de registro de eventos de Python. Explica niveles de registro, loggers, handlers, formatos y configuración. Es importante para implementar trazabilidad y diagnóstico de errores en módulos de Odoo."
  url: "https://docs.python.org/3/library/logging.html"

# ============================================================
# 4. XML - ESTRUCTURACIÓN Y TRANSFORMACIÓN DE DATOS
# ============================================================

- fuente: "W3C – XML 1.0 Specification"
  descripcion: "Especificación oficial del lenguaje XML. Define la sintaxis, estructura de documentos, elementos, atributos, entidades y reglas de buena formación. Es la referencia normativa para comprender los archivos XML utilizados por Odoo."
  url: "https://www.w3.org/TR/xml/"

- fuente: "W3C – Namespaces in XML"
  descripcion: "Especificación de los espacios de nombres XML. Explica cómo identificar elementos y atributos mediante namespaces y evitar conflictos entre vocabularios XML."
  url: "https://www.w3.org/TR/xml-names/"

- fuente: "W3C – XPath 1.0"
  descripcion: "Especificación del lenguaje XPath para localizar nodos dentro de documentos XML. Resulta especialmente importante para comprender las expresiones utilizadas en la herencia y modificación de vistas de Odoo."
  url: "https://www.w3.org/TR/1999/REC-xpath-19991116/"

- fuente: "Python – XML Processing"
  descripcion: "Documentación oficial de las herramientas de Python para procesar documentos XML. Incluye ElementTree, SAX y DOM. Permite trabajar con documentos XML desde código Python."
  url: "https://docs.python.org/3/library/xml.html"

- fuente: "MDN – XML"
  descripcion: "Material técnico de referencia sobre XML y su integración con tecnologías web. Complementa las especificaciones normativas con explicaciones y ejemplos prácticos."
  url: "https://developer.mozilla.org/en-US/docs/Web/XML"

# ============================================================
# 5. POSTGRESQL Y ACCESO A DATOS
# ============================================================

- fuente: "PostgreSQL – Documentación oficial"
  descripcion: "Documentación oficial del sistema gestor de bases de datos utilizado por Odoo. Incluye administración, arquitectura, SQL, tipos de datos, índices, transacciones, restricciones, funciones y optimización de consultas."
  url: "https://www.postgresql.org/docs/"

- fuente: "PostgreSQL – Tutorial SQL"
  descripcion: "Tutorial oficial de SQL para PostgreSQL. Explica creación de tablas, inserción de datos, consultas, relaciones, agregaciones, joins, actualizaciones y eliminación de registros. Adecuado para reforzar los conocimientos de persistencia utilizados por el ORM."
  url: "https://www.postgresql.org/docs/current/tutorial.html"

- fuente: "PostgreSQL – SQL Commands"
  descripcion: "Referencia de las instrucciones SQL disponibles en PostgreSQL. Incluye DDL, DML, gestión de esquemas, tablas, índices, restricciones y operaciones sobre datos."
  url: "https://www.postgresql.org/docs/current/sql-commands.html"

- fuente: "PostgreSQL – Índices"
  descripcion: "Documentación sobre índices y optimización de consultas. Explica los diferentes tipos de índices, sus características y su impacto en el rendimiento de las operaciones de base de datos."
  url: "https://www.postgresql.org/docs/current/indexes.html"

- fuente: "PostgreSQL – Transacciones"
  descripcion: "Documentación sobre el funcionamiento de las transacciones, aislamiento, concurrencia y control de integridad. Permite comprender las garantías de consistencia de las operaciones realizadas por Odoo."
  url: "https://www.postgresql.org/docs/current/tutorial-transactions.html"

- fuente: "Psycopg – Documentación oficial"
  descripcion: "Documentación del adaptador PostgreSQL para Python utilizado por el ecosistema Odoo. Explica conexiones, cursores, ejecución de SQL, parámetros, transacciones, tipos de datos y gestión de errores."
  url: "https://www.psycopg.org/psycopg3/docs/"

# ============================================================
# 6. CALIDAD DEL CÓDIGO Y CONVENCIONES OCA
# ============================================================

- fuente: "OCA – Developer documentation"
  descripcion: "Documentación de referencia para desarrolladores de la Odoo Community Association. Incluye procedimientos de desarrollo colaborativo, convenciones, herramientas, buenas prácticas y mantenimiento de módulos comunitarios."
  url: "https://odoo-community.org/page/development"

- fuente: "OCA – Guidelines"
  descripcion: "Guías de contribución y convenciones de desarrollo de la comunidad OCA. Permiten conocer los criterios de organización de repositorios, nomenclatura, calidad, revisión de código y contribución a módulos."
  url: "https://github.com/OCA/odoo-community.org"

- fuente: "Odoo 19 – Coding Guidelines"
  descripcion: "Guía oficial de convenciones de desarrollo de Odoo. Describe organización de módulos, nomenclatura, estructura de archivos, estilo Python, XML, JavaScript, CSS y criterios de calidad del código."
  url: "https://www.odoo.com/documentation/19.0/contributing/development/coding_guidelines.html"

- fuente: "OCA – Repositorios de módulos comunitarios"
  descripcion: "Organización oficial de repositorios de módulos desarrollados por OCA. Permite consultar implementaciones reales, estudiar patrones de extensión del ORM, herencia de modelos y vistas, seguridad, pruebas y convenciones de desarrollo."
  url: "https://github.com/OCA"

- fuente: "OCA – Maintainer Quality Tools"
  descripcion: "Herramientas utilizadas en proyectos OCA para automatizar controles de calidad, análisis estático, comprobación de convenciones, validación de manifiestos y revisión de módulos."
  url: "https://github.com/OCA/maintainer-quality-tools"

- fuente: "Pylint – Documentación oficial"
  descripcion: "Herramienta de análisis estático para Python. Permite detectar errores, código potencialmente problemático, incumplimientos de estilo y problemas de mantenibilidad."
  url: "https://pylint.readthedocs.io/"

- fuente: "Ruff – Documentación oficial"
  descripcion: "Herramienta rápida de análisis estático y formateo de Python. Permite aplicar reglas de calidad y estilo de código de forma automatizada."
  url: "https://docs.astral.sh/ruff/"

- fuente: "Pre-commit – Documentación oficial"
  descripcion: "Herramienta para ejecutar automáticamente controles de calidad antes de realizar commits. Permite configurar validaciones de Python, XML, YAML y otros formatos dentro del flujo de desarrollo."
  url: "https://pre-commit.com/"

# ============================================================
# 7. CONTROL DE VERSIONES Y ENTORNO DE DESARROLLO
# ============================================================

- fuente: "Git – Documentación oficial"
  descripcion: "Referencia del sistema de control de versiones Git. Explica repositorios, commits, ramas, fusiones, diferencias y gestión del historial de cambios. Esencial para trabajar con los repositorios OCB y OCA."
  url: "https://git-scm.com/doc"

- fuente: "Visual Studio Code – Documentación"
  descripcion: "Documentación del entorno de desarrollo Visual Studio Code. Incluye edición, depuración de Python, terminal integrada, extensiones, integración con Git y configuración de espacios de trabajo."
  url: "https://code.visualstudio.com/docs"

- fuente: "Docker Compose – Documentación oficial"
  descripcion: "Documentación de Docker Compose para definir y gestionar aplicaciones multicontenedor. Explica servicios, redes, volúmenes, variables de entorno y configuración de contenedores. Aplicable al entorno de ejecución del laboratorio Odoo."
  url: "https://docs.docker.com/compose/"

- fuente: "Docker – Volumes"
  descripcion: "Documentación sobre volúmenes y montajes de directorios en contenedores. Permite comprender cómo compartir el código fuente OCB, los addons personalizados y los archivos de configuración entre el host y el contenedor Odoo."
  url: "https://docs.docker.com/engine/storage/volumes/"
