# =============================================================================
# PLANIFICACIÓN DE PRÁCTICAS
# =============================================================================
#
# Este archivo define las prácticas de cada unidad didáctica.
#
# Cada práctica debe describir:
#   - Su finalidad y relación con los contenidos teóricos.
#   - Los aspectos que se van a trabajar.
#   - Los conocimientos y procedimientos mínimos que debe adquirir el alumno.
#   - El escenario técnico necesario para realizarla.
#   - Los procedimientos que debe ejecutar el alumno.
#   - Los entregables y las comprobaciones que permitirán evaluarla.
#
# Los escenarios pueden ser ejecutables (Docker Compose, GNS3...) o estar
# simplemente documentados cuando no se disponga de un entorno automatizado.
#
# IMPORTANTE:
#   - No generar prácticas que no estén declaradas en este archivo.
#   - No inventar configuraciones, direcciones, versiones ni recursos técnicos.
#   - Los campos pendientes deben completarse antes de generar la práctica.
#   - El estado inicial de toda práctica nueva será "borrador".
#   - probada solo podrá establecerse a true después de su ejecución y
#     comprobación por parte del profesor.
#
# NOTA DE RECONSTRUCCIÓN (ver informe entregado junto con esta versión):
#   Este archivo ha sido reconstruido a partir del contenido ya existente en
#   practicas/unidades/01-04. Los campos "sesiones" se han estimado a partir
#   del nº de palabras real de cada práctica (ver "palabras") aplicando
#   palabras_por_sesion y factor_tipo; deben revisarse y ajustarse por el
#   profesor. Los campos "contenidos" enlazan con contenidos/unidades.yml;
#   varios de estos enlaces son aproximados o señalan una laguna de
#   contenidos (ver informe). Las unidades 5-7 no tienen prácticas porque no
#   existe contenido alguno en practicas/unidades/05-07.
#
# =============================================================================


# -----------------------------------------------------------------------------
# CONFIGURACIÓN GENERAL
# -----------------------------------------------------------------------------

configuracion:

  # Extensión orientativa del documento en función de las sesiones previstas.
  palabras_por_sesion: 300

  # Margen de variación permitido respecto a la extensión calculada.
  tolerancia: 0.30

  # Multiplicador aplicado a la extensión según el tipo de práctica.
  factor_tipo:
    guiada: 1.0
    autonoma: 0.8
    laboratorio: 1.3
    caso_practico: 1.1

  # Tipos de práctica admitidos.
  tipos:
    - guiada
    - autonoma
    - laboratorio
    - caso_practico

  # Tipos de escenario técnico admitidos.
  escenarios:
    - docker-compose
    - documentado en recursos dentro de la unidad
    - otro

  # Modalidad de disponibilidad del escenario.
  modalidades:
    - ejecutable
    - documentado

  # Estados del proceso de elaboración y revisión.
  estados:
    - borrador
    - revisado
    - aprobado

  # Directorios de trabajo del proyecto.
  directorios:
    contenidos: contenidos/unidades
    practicas: practicas/unidades
    artefactos: practicas/artefactos
    documentacion: documentacion
    recursos: practicas/unidades/<unidad>/recursos
    trabajo: trabajo


# -----------------------------------------------------------------------------
# UNIDADES DIDÁCTICAS
# -----------------------------------------------------------------------------

unidades:

  # ===========================================================================
  # UNIDAD 5 — Desarrollo de Módulos con Odoo
  # ===========================================================================

  - unidad: 5
    titulo: "Desarrollo de Módulos con Odoo"

    practicas:

      # -----------------------------------------------------------------------
      # PLANTILLA DE PRÁCTICA
      # Copiar este bloque para añadir una nueva práctica.
      # -----------------------------------------------------------------------

      # - id: "u01-pNN"
      #
      #   # Nombre descriptivo de la práctica.
      #   titulo: ""
      #
      #   # Tipo: guiada, autonoma, laboratorio o caso_practico.
      #   tipo: ""
      #
      #   # Identificadores de los contenidos teóricos relacionados.
      #   # Utilizar los identificadores definidos en contenidos/unidades.yml.
      #   contenidos: []
      #
      #   # Duración prevista en sesiones.
      #   sesiones:
      #
      #   # Extensión orientativa en palabras. Si se deja vacía, se calculará
      #   # a partir de las sesiones y de la configuración general.
      #   palabras:
      #
      #   # Fuentes de información utilizadas para elaborar la práctica.
      #   # Las referencias deben proceder de fuentes autorizadas.
      #   fuentes: []
      #
      #   # URLs oficiales de consulta específicas de esta práctica.
      #   urls: []
      #
      #   # Documentos locales de referencia.
      #   # Indicar rutas relativas dentro de documentacion/.
      #   documentos: []
      #
      #   # ---------------------------------------------------------------------
      #   # CONTENIDO Y ALCANCE
      #   # ---------------------------------------------------------------------
      #
      #   # Aspectos concretos que se van a trabajar.
      #   aspectos: []
      #
      #   # Conocimientos y procedimientos mínimos que debe adquirir el alumno.
      #   # Cada mínimo debe aparecer desarrollado en el procedimiento.
