      #
      #   # ---------------------------------------------------------------------
      #   # ESCENARIO TÉCNICO
      #   # ---------------------------------------------------------------------
      #
      #   escenario:
      #
      #     # Tipo de escenario:
      #     # docker-compose | gns3 | documentado | otro
      #     tipo: ""
      #
      #     # Modalidad:
      #     # ejecutable | documentado
      #     modalidad: ""
      #
      #     # Descripción del escenario y su finalidad didáctica.
      #     descripcion: ""
      #
      #     # Ruta relativa a los recursos técnicos de la práctica.
      #     # Ejemplo: practicas/artefactos/unidad01/u01-p01/
      #     artefactos: ""
      #
      #     # Requisitos para preparar y ejecutar el escenario.
      #     requisitos: []
      #
      #     # Máquinas virtuales, contenedores, equipos o dispositivos.
      #     dispositivos: []
      #
      #     # Servicios y aplicaciones utilizados.
      #     servicios: []
      #
      #     # Descripción de la topología o arquitectura.
      #     topologia: ""
      #
      #     # Direccionamiento, nombres, puertos y otros parámetros.
      #     # No incluir valores ficticios: documentar los reales.
      #     direccionamiento: []
