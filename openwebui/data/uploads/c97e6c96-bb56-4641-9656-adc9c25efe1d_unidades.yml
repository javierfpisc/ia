      #     # Operaciones necesarias para gestionar el escenario.
      #     operaciones:
      #       inicio: []
      #       parada: []
      #       limpieza: []
      #       validacion: []
      #
      #   # ---------------------------------------------------------------------
      #   # PROCEDIMIENTO
      #   # ---------------------------------------------------------------------
      #
      #   # Secuencia de tareas que realizará el alumno.
      #   # Cada procedimiento debe describir la acción y su comprobación.
      #   procedimientos: []
      #
      #   # ---------------------------------------------------------------------
      #   # EVALUACIÓN Y RESULTADOS
      #   # ---------------------------------------------------------------------
      #
      #   # Archivos, configuraciones, capturas o informes que debe entregar.
      #   entregables: []
      #
      #   # Comprobaciones que permitirán verificar el resultado.
      #   comprobaciones: []
      #
      #   # Riesgos, advertencias y posibles efectos de las operaciones.
      #   riesgos: []
      #
      #   # ---------------------------------------------------------------------
      #   # CONTROL DE ELABORACIÓN
      #   # ---------------------------------------------------------------------
      #
      #   estado: borrador
      #   probada: false

      - id: "1-crear-modulo-con-agente"
        titulo: "Creación de un módulo Odoo con agente IA"
        tipo: laboratorio
        contenidos: ["1-modulos-odoo", "2-modelos-odoo", "3-vistas-odoo", "4-acciones-odoo", "5-seguridad-odoo"]
        sesiones: 5
        fuentes: documentacion/unidad5-modulos
        # Fragmentos que seleccionan las URLs de fuentes.yaml usadas por esta práctica.
        urls:
          - "developer/tutorials/server_framework_101"
          - "reference/backend/orm"
          - "reference/user_interface/view_architectures"
          - "reference/backend/actions"
          - "reference/backend/security"
          - "reference/backend/data"
          - "reference/backend/testing"
          - "administration/install/source"
          - "docs.docker.com/compose"
        aspectos:
          - "Estructura de un módulo Odoo"
          - "Creación de modelos, vistas y acciones"
          - "Instrucciones al agente de IA basadas en AGENTS.md y los requisitos funcionales"
          - "Validación de un módulo: instalación, actualización y revisión de logs"
        minimos:
          - "Obtener una versión funcional de un módulo en base a las especificaciones de la práctica"
        # Diagrama de flujo: instrucciones, agente, repositorio, contenedores y navegador.
        diagramas: 1
        escenario:
          tipo: documentado en recursos dentro de la unidad
          modalidad: ejecutable
          descripcion: "Entorno Docker Compose con Odoo 19 y PostgreSQL 17 para desarrollar y probar, con un agente de IA, un módulo a partir del repositorio odoo-ai-lab."
          artefactos: "practicas/unidades/05/recursos/05/odoo-ai-lab"
          requisitos: ["Docker Engine y Docker Compose", "Imágenes de Odoo 19 y PostgreSQL 17 facilitadas para el curso", "Fuentes OCB/OCA 19 en el host (por defecto ~/odoo/src/OCB)", "odoo.conf del curso", "Visual Studio Code con un agente de programación", "Git"]
          dispositivos: ["Contenedor odoo-ai-lab (Odoo 19)", "Contenedor postgres-ai-lab (PostgreSQL 17)"]
          servicios: ["Odoo 19 (puerto 8069)", "PostgreSQL 17 (servicio db)"]
          topologia: "Dos contenedores en la red por defecto de Compose; Odoo accede a la base de datos mediante el nombre de servicio db."
          direccionamiento: ["Odoo: http://localhost:8069 en el equipo anfitrión", "PostgreSQL: sin puerto publicado, accesible solo desde la red de Compose"]
          operaciones:
            inicio: ["cp .env.example .env", "docker compose up -d"]
            parada: ["docker compose stop"]
            limpieza: ["docker compose down (conserva el volumen de PostgreSQL)", "docker compose down -v (elimina el volumen de PostgreSQL; solo con autorización)"]
            validacion: ["docker compose ps", "docker compose logs -f odoo", "acceso a http://localhost:8069"]
        procedimientos:
          - "Configurar el entorno de trabajo para integrar un agente de IA de tipo free"
          - "Revisar el AGENTS.md de los recursos de la práctica para entender el proceso de generación de código"
          - "Añadir requisitos y funcionalidades del módulo a generar mediante instrucciones al agente IA"
          - "Crear un nuevo módulo siguiendo la estructura recomendada mediante instrucciones al agente IA"
          - "Probar el módulo en un entorno Odoo funcional y corregir errores mediante instrucciones al agente IA"
        entregables: ["Módulo Odoo funcional según los requisitos"]
        comprobaciones: ["El módulo se ejecuta correctamente", "Cumple los requisitos especificados en la práctica"]
        riesgos:
          - "La instalación o actualización del módulo modifica la base de datos de trabajo: no uses datos que quieras conservar"
          - "docker compose down -v elimina el volumen de PostgreSQL y, con él, las bases de datos del laboratorio"
          - "El agente puede proponer APIs o patrones que no existan en Odoo 19: deben comprobarse en las fuentes locales antes de aceptarlos"
        estado: borrador
        probada: false
