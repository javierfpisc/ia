- fuente: "Ansible – Collections"
  descripcion: "Documentación sobre colecciones, mecanismo de distribución y organización de módulos, plugins, roles y otros componentes reutilizables de Ansible. Permite estudiar la extensión de las capacidades de automatización."
  url: "https://docs.ansible.com/projects/ansible/latest/collections_guide/index.html"

- fuente: "Ansible – Module Index"
  descripcion: "Catálogo oficial de módulos disponibles en Ansible. Permite localizar las operaciones de administración de paquetes, usuarios, servicios, archivos, redes, sistemas operativos y otros recursos."
  url: "https://docs.ansible.com/projects/ansible/latest/collections/index_module.html"

- fuente: "Ansible – Configuration Settings"
  descripcion: "Referencia de los parámetros de configuración de Ansible, incluyendo el archivo ansible.cfg, rutas de búsqueda, opciones de conexión, comportamiento de ejecución y configuración general del entorno."
  url: "https://docs.ansible.com/projects/ansible/latest/reference_appendices/config.html"

- fuente: "Ansible – Best Practices"
  descripcion: "Recomendaciones para organizar proyectos Ansible, estructurar inventarios y playbooks, reutilizar roles y mantener configuraciones de automatización comprensibles y mantenibles."
  url: "https://docs.ansible.com/projects/ansible/latest/tips_tricks/ansible_tips_tricks.html"


