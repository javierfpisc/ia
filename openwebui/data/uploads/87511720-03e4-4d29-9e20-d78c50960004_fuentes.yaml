# ============================================================
# 19. INFRAESTRUCTURA COMO CÓDIGO (IaC): CONCEPTOS, PRINCIPIOS Y FUNDAMENTOS
# ============================================================

- fuente: "AWS – ¿Qué es la infraestructura como código (IaC)?"
  descripcion: "Introducción conceptual a la infraestructura como código. Explica la automatización del aprovisionamiento y mantenimiento de infraestructuras mediante definiciones legibles por máquinas, sus ventajas frente a la administración manual y los enfoques declarativo e imperativo."
  url: "https://aws.amazon.com/es/what-is/iac/"

- fuente: "AWS – Choosing an infrastructure as code tool for your organization"
  descripcion: "Guía técnica para comprender el papel de las herramientas IaC, sus diferentes enfoques y los criterios para seleccionar soluciones de automatización de infraestructura. Útil para introducir el ecosistema de herramientas y sus diferencias."
  url: "https://docs.aws.amazon.com/prescriptive-guidance/latest/choose-iac-tool/"

- fuente: "NIST – Computer Security Resource Center: Infrastructure as Code"
  descripcion: "Referencia terminológica del NIST sobre infraestructura como código, vinculada a publicaciones técnicas de la serie NIST SP 800. Permite relacionar IaC con las prácticas de ingeniería y seguridad de sistemas."
  url: "https://csrc.nist.gov/glossary/term/infrastructure_as_code"

- fuente: "UK Government – Engineering Guidance: Infrastructure as Code"
  descripcion: "Guía de ingeniería del Gobierno británico sobre los principios de IaC. Aborda el almacenamiento de definiciones en repositorios, control de versiones, validación, revisión de cambios, automatización CI/CD y protección de secretos. Especialmente interesante para introducir buenas prácticas profesionales."
  url: "https://engineering.homeoffice.gov.uk/standards/infrastructure-as-code/"

- fuente: "HashiCorp – Use Infrastructure as Code"
  descripcion: "Explicación técnica del enfoque declarativo de infraestructura como código, el estado deseado, la revisión de configuraciones, las pruebas automatizadas y la integración con procesos CI/CD."
  url: "https://docs.hashicorp.com/well-architected-framework/define-and-automate-processes/define/as-code/infrastructure"


# ============================================================
# 20. OPENTOFU: INTRODUCCIÓN, INSTALACIÓN Y FUNDAMENTOS
# ============================================================

- fuente: "OpenTofu – Documentación oficial"
  descripcion: "Documentación principal del proyecto OpenTofu, herramienta libre y de código abierto para definir, aprovisionar y administrar infraestructura mediante configuraciones declarativas. Incluye introducción, primeros pasos, lenguaje de configuración, CLI y documentación técnica."
  url: "https://opentofu.org/docs/"

- fuente: "OpenTofu – Getting Started"
  descripcion: "Guía de iniciación para instalar y comenzar a utilizar OpenTofu. Referencia para introducir el flujo de trabajo básico de inicialización, planificación y aplicación de configuraciones."
  url: "https://opentofu.org/docs/intro/"

- fuente: "OpenTofu – Installation"
  descripcion: "Documentación oficial de instalación de OpenTofu en diferentes sistemas operativos y plataformas. Incluye alternativas de instalación y distribución del ejecutable."
  url: "https://opentofu.org/docs/intro/install/"

- fuente: "OpenTofu – Command Line Interface (CLI)"
  descripcion: "Referencia de los comandos de administración de OpenTofu. Permite estudiar operaciones como init, validate, plan, apply, destroy, output y gestión de configuraciones desde terminal."
  url: "https://opentofu.org/docs/cli/"

- fuente: "OpenTofu – Configuration Language"
  descripcion: "Referencia del lenguaje declarativo de OpenTofu. Explica la estructura de los archivos de configuración, bloques, argumentos, expresiones, variables y mecanismos para describir los recursos de infraestructura."
  url: "https://opentofu.org/docs/language/"

- fuente: "OpenTofu – Resources"
  descripcion: "Explicación de los recursos administrados por OpenTofu y de cómo se representan los elementos de infraestructura mediante bloques de configuración. Incluye dependencias, comportamiento de los recursos y argumentos de configuración."
  url: "https://opentofu.org/docs/language/resources/"

- fuente: "OpenTofu – Providers"
  descripcion: "Documentación sobre los proveedores que permiten a OpenTofu interactuar con plataformas de virtualización, servicios cloud, APIs y otros sistemas. Explica su declaración, configuración, instalación y gestión de versiones."
  url: "https://opentofu.org/docs/language/providers/"

- fuente: "OpenTofu – Public Registry"
  descripcion: "Registro público oficial de proveedores y módulos reutilizables para OpenTofu. Permite localizar integraciones con plataformas de infraestructura, consultar documentación y descubrir recursos disponibles para automatizar sistemas."
  url: "https://search.opentofu.org/"

- fuente: "OpenTofu – Modules"
  descripcion: "Documentación sobre módulos de infraestructura, mecanismos para organizar, reutilizar y compartir configuraciones. Explica los módulos raíz, módulos secundarios y utilización de módulos publicados en registros."
  url: "https://opentofu.org/docs/language/modules/"

- fuente: "OpenTofu – Creating Modules"
  descripcion: "Guía para desarrollar módulos reutilizables, organizar configuraciones en archivos y directorios, utilizar variables de entrada y valores de salida y estructurar proyectos de infraestructura mantenibles."
  url: "https://opentofu.org/docs/language/modules/develop/"

- fuente: "OpenTofu – Providers Requirements"
  descripcion: "Explica cómo declarar los proveedores necesarios para un proyecto, especificar sus fuentes y establecer restricciones de versiones. Permite estudiar la reproducibilidad y el control de dependencias."
  url: "https://opentofu.org/docs/language/providers/requirements/"

- fuente: "OpenTofu – State"
  descripcion: "Documentación sobre el estado de infraestructura y su función en el seguimiento de los recursos administrados. Referencia importante para comprender la relación entre las configuraciones declaradas y los recursos existentes, así como la gestión del estado."
  url: "https://opentofu.org/docs/language/state/"


