- fuente: "Ansible – Playbook Guide"
  descripcion: "Guía técnica de utilización de playbooks. Aborda la organización de tareas, ejecución condicional, bucles, variables, handlers, reutilización de configuraciones y operaciones de automatización más complejas."
  url: "https://docs.ansible.com/projects/ansible/latest/playbook_guide/"

- fuente: "Ansible – Roles"
  descripcion: "Documentación sobre roles como mecanismo de organización y reutilización de procedimientos de automatización. Explica su estructura de directorios, tareas, variables, plantillas, archivos y handlers."
