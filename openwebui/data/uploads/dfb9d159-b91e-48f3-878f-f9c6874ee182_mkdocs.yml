site_name: Materiales BRS (vista previa local)
site_description: Vista previa local de contenidos y prácticas del módulo Bastionado de redes y sistemas
docs_dir: /docs
site_dir: /tmp/site
use_directory_urls: true

# instrucciones.txt de contenidos/ y practicas/ son enlaces a ../../ que no existen dentro de los volúmenes montados.
exclude_docs: |
  *.txt

theme:
  name: material
  language: es

plugins:
  - search:
      lang: es
  - awesome-pages

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
