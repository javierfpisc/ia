        diagramas: 2
        fuentes: documentacion/unidad4-redes-seguras
        urls: [sp/800/41, netfilter.org/documentation, projects/iptables, man8/iptables.8, conntrack-tools, man8/conntrack.8]
        minimos:
          - Concepto y función del firewall
          - Filtrado de paquetes y control de tráfico en protocolos IP y TCP/UDP
          - Arquitectura Netfilter en Linux
          - Reglas iptables (tablas, cadenas, objetivos)
          - Políticas de filtrado (stateless y stateful)
          - Ejemplos prácticos de reglas de firewall
        estado: borrador
      - id: 04-vlan
        titulo: VLANs
        diagramas: 2
        fuentes: documentacion/unidad4-redes-seguras
        urls: [ieee/802.1Q, ieee802.org/1/, networking/bridge, man8/ip-link.8]
        minimos:
          - Definición y beneficios de VLANs
          - Ámbito de operación en el modelo de capas
          - Tipos de VLANs (por puerto, por protocolo)
          - Tipos de puertos, acceso y trunk
          - La necesidad de añadir etiquetas VLAN a tramas Ethernet en enlaces troncales
          - Etiquetado 802.1Q
          - Segmentación de redes mediante VLANs
        estado: borrador
      - id: 05-vpn
