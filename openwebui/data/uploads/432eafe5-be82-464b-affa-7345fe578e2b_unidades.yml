        diagramas: 2
        fuentes: documentacion/unidad4-redes-seguras
        urls: [wireguard.com, openvpn.net/community, rfc2784, rfc8446]
        minimos:
          - Concepto y tipos de VPN (site-to-site, remote-access)
          - Túneles y encapsulación
          - Comparativa de protocolos VPN (OpenVPN, WireGuard, IPsec)
          - Casos de uso de VPN
        estado: borrador
      - id: 06-ipsec
