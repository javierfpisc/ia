    sesiones: 30
    apartados:
      - id: 01-introduccion-protocolos-red
        titulo: "Introducción a protocolos de red: arquitectura en capas, pila TCP/IP"
        diagramas: 2
        fuentes: documentacion/unidad4-redes-seguras
        urls: [rfc791, rfc9293, rfc768, rfc792, rfc1122, rfc826, rfc2131, rfc1035]
        minimos:
          - Concepto de arquitectura de red en capas. Interacción entre capas y encapsulación de datos
          - Interacción entre capas, servicios y protocolos
          - Flujo de la información entre capas de arriba hacia abajo y de abajo hacia arriba
          - Interacción entre pares de capas (peer-to-peer)
          - Modelo de capas (OSI y TCP/IP)
          - Pila de protocolos TCP/IP
          - Protocolos principales por capa (IP, TCP, UDP, ICMP, DNS, DHCP, ARP)
        estado: borrador
      - id: 02-direccionamiento-ipv4
        titulo: "Direccionamiento IPv4: subnetting, CIDR, VLSM"
        diagramas: 2
        fuentes: documentacion/unidad4-redes-seguras
        urls: [rfc791, rfc4632, ipv4-address-space, iana-ipv4-special-registry]
        minimos:
          - Estructura de direcciones IPv4 (clases y formato)
          - Cálculo de subredes (subnetting)
          - Notación CIDR
          - VLSM (Variable Length Subnet Mask)
          - Direcciones especiales y rangos privados
        estado: borrador
      - id: 03-firewall-netfilter-iptables
