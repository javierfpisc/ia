# Meta archivo de extensión y alcance de los contenidos.
# Lo mantiene el profesor. El agente lo lee para dimensionar cada apartado; no inventa valores.
#
# Presupuesto de palabras de un apartado (si no se fija `palabras`):
#   sesiones_apartado × palabras_por_sesion × factor_profundidad
# donde sesiones_apartado = `sesiones` del apartado o, si falta, sesiones de la unidad / nº de apartados.
# Los valores de `configuracion` son propuestos y editables.

configuracion:
  palabras_por_sesion: 300
  tolerancia: 0.30          # margen admitido sobre el presupuesto (±30 %)
  factor_profundidad:
    introductorio: 0.8
    descriptivo: 1.0
    aplicado: 1.3

# Campos de cada apartado:
#   id            nombre del archivo .md de salida (sin extensión) en contenidos/unidades/NN/
#   titulo        título del apartado
#   sesiones      (opcional) sesiones dedicadas
#   palabras      (opcional) presupuesto fijo; anula el cálculo
#   profundidad   (opcional) introductorio | descriptivo | aplicado
#   diagramas     nº mínimo de diagramas Mermaid/imágenes
#   fuentes       carpeta de documentacion/ con las fuentes (fuentes.yaml y documentos)
#   urls          textos que seleccionan, dentro de fuentes.yaml, las URLs que usa este apartado
#   documentos    textos que seleccionan, por ruta, los documentos locales de la carpeta `fuentes` que usa este apartado
#   incluir / excluir   (opcionales) temas a cubrir o a dejar fuera
#   minimos       (opcional) lista de aspectos/conceptos OBLIGATORIOS a mencionar en el apartado.
#                 Garantiza cobertura de contenidos fundamentales. Usado para validación en calidad.py
#   autoevaluacion  (opcional) nº de preguntas de «Comprueba lo aprendido». Si falta, el apartado NO lleva esa sección
#   estado        borrador | revisado | aprobado  (ciclo de revisión humana)

unidades:
  - unidad: 0
    titulo: Introducción al módulo
    apartados:
      - id: aspectos-legales-del-modulo
        titulo: Marco legal del módulo Bastionado de redes y sistemas
        palabras: 1300
        diagramas: 2
        fuentes: documentacion/unidad0-introduccion
        minimos:
          - Normativa legal aplicable a ciberseguridad en España
          - Regulaciones de privacidad y protección de datos
          - Marcos de cumplimiento normativo del sector
        estado: borrador

  - unidad: 1
    titulo: Diseño de planes de seguridad
    sesiones: 12
    profundidad: introductorio
    apartados:
      - id: 01-plan-director-seguridad
        titulo: Plan director de seguridad
        diagramas: 2
        fuentes: documentacion/unidad1-planes-seguridad
        urls: [incibe.es/empresas/que-te-interesa/plan-director, incibe.es/empresas/blog/sabes-gestionar, iso.org/isoiec-27001]
        documentos: [PLAN_DIRECTOR_SEGURIDAD/]
        minimos:
          - Definición y propósito del plan director de seguridad
          - Fases de elaboración (diagnóstico, análisis de riesgos, estrategia)
          - Alineación con objetivos de negocio
          - Gobernanza y roles de responsabilidad
        estado: borrador
      - id: 02-politica-seguridad-ccn-805
        titulo: Política de seguridad según CCN-STIC 805
        diagramas: 1
        fuentes: documentacion/unidad1-planes-seguridad
        urls: [ens.ccn.cni.es, boe.es/eli/es/rd/2022/05/03/311, 1282-actualizacion]
        documentos: [POLITICA_SEGURIDAD/]
        minimos:
          - Concepto de política de seguridad de la información
          - Normativa CCN-STIC 805 y su ámbito de aplicación
          - Estructura y componentes de una política de seguridad
          - Criterios de categorización de sistemas según CCN
        estado: borrador
      - id: 03-gestion-ciberincidentes-ccn-817
        titulo: Gestión de ciberincidentes según CCN-STIC 817
        diagramas: 2
        fuentes: documentacion/unidad1-planes-seguridad
        urls: [iso.org/standard/78973]
        documentos: [INCIDENTES/]
        minimos:
          - Definición y clasificación de incidentes de seguridad
          - Procedimiento de detección y reporte de incidentes
          - "Plan de respuesta a incidentes (fases: contención, erradicación, recuperación)"
