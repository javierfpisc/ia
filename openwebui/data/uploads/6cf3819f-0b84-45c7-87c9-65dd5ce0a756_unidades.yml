# Meta archivo de extensión y alcance de los contenidos.
# Lo mantiene el profesor. El agente lo lee para dimensionar cada apartado; no inventa valores.
#
# Presupuesto de palabras de un apartado (si no se fija `palabras`):
#   sesiones_apartado × palabras_por_sesion × factor_profundidad
# donde sesiones_apartado = `sesiones` del apartado o, si falta, sesiones de la unidad / nº de apartados.
# Los valores de `configuracion` son propuestos y editables.
#
# RECONSTRUIDO a partir de contenidos/unidades/NN/*.md (ver trabajo/_respaldo/ para la versión anterior).
# Los campos marcados con POR DEFINIR no se pueden deducir de los archivos existentes.

configuracion:
  palabras_por_sesion: 300
  tolerancia: 0.30          # margen admitido sobre el presupuesto (±30 %)
  factor_profundidad:
    introductorio: 0.8
    descriptivo: 1.0
    aplicado: 1.3

# Campos de cada apartado:
#   id            nombre del archivo .md de salida (sin extensión) en contenidos/unidades/NN/
#   titulo        título del apartado
#   sesiones      (opcional) sesiones dedicadas
#   palabras      (opcional) presupuesto fijo; anula el cálculo
#   profundidad   (opcional) introductorio | descriptivo | aplicado
#   diagramas     nº mínimo de diagramas Mermaid/imágenes
#   fuentes       carpeta de documentacion/ con las fuentes (fuentes.yaml y documentos)
#   urls          textos que seleccionan, dentro de fuentes.yaml, las URLs que usa este apartado
#   documentos    textos que seleccionan, por ruta, los documentos locales de la carpeta `fuentes` que usa este apartado
#   incluir / excluir   (opcionales) temas a cubrir o a dejar fuera
#   minimos       (opcional) lista de aspectos/conceptos OBLIGATORIOS a mencionar en el apartado.
#   autoevaluacion  (opcional) nº de preguntas de «Comprueba lo aprendido». Si falta, el apartado NO lleva esa sección
#   estado        borrador | revisado | aprobado  (ciclo de revisión humana)

unidades:
  - unidad: 5
    titulo: Desarrollo de Módulos en Odoo
    sesiones: 18
    apartados:
      - id: 1-modulos-odoo
        titulo: "Creación de Módulos en Odoo: Estructura y Componentes"
        palabras: 1300
        diagramas: 2
        fuentes: documentacion/unidad5-modulos
        minimos:
          - Definición de módulos y su importancia en Odoo
          - Estructura de un módulo Odoo (archivos y carpetas)
          - Componentes clave de un módulo (modelos, vistas, controladores)
          - Creación de un módulo básico paso a paso
          - Configuración de dependencias y manifest file
        estado: borrador
      - id: 2-modelos-odoo
        titulo: "Modelos de Datos en Odoo: Creación y Gestión"
        diagramas: 3
        fuentes: documentacion/unidad5-modulos
        minimos:
          - Definición de modelos en Odoo
          - Relación con la base de datos y ORM (Object-Relational Mapping)
          - Creación de modelos personalizados
          - Campos y tipos de datos en modelos
          - Relaciones entre modelos (One2many, Many2one, Many2many)
          - Herencia de modelos y extensiones
          - Api de modelos y métodos
        estado: borrador
      - id: 3-vistas-odoo
        titulo: "Vistas en Odoo: Definición y Configuración"
        diagramas: 2
        fuentes: documentacion/unidad5-modulos
        minimos:
          - Tipos de vistas en Odoo (formulario, lista, kanban, calendario, gráfico)
          - Configuración de vistas mediante XML
          - Personalización de vistas y herencia
          - Uso de widgets y elementos interactivos
          - Relación entre vistas y modelos
        estado: borrador
      - id: 4-acciones-odoo
        titulo: "Acciones en Odoo: Definición y Configuración"
        diagramas: 2
        fuentes: documentacion/unidad5-modulos
        minimos:
          - Tipos de acciones en Odoo (acciones de servidor, acciones de ventana, acciones de informe)
          - Configuración de acciones mediante XML
          - Relación entre acciones y vistas
          - Personalización de acciones y herencia
        estado: borrador  
      - id: 5-seguridad-odoo
        titulo: "Seguridad en Odoo: Definición y Configuración"
        diagramas: 2
        fuentes: documentacion/unidad5-modulos
        minimos:
          - Tipos de seguridad en Odoo (acceso, permisos, control de versiones)
          - Configuración de seguridad mediante XML y CSV
          - Gestión de grupos de usuarios y roles
          - Configuración de permisos de acceso a modelos y registros
          - Configuración de reglas de seguridad y restricciones
          - Configuración de reglas de acceso a vistas y menús
        estado: borrador 