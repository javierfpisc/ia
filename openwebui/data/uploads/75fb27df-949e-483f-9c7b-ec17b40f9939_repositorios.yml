# Configuración de publicación de materiales en GitHub
#
# Los repositorios de origen son:
#   conceptos/unidades/<unidad>/
#   practicas/unidades/<unidad>/
#
# Cada destino indica el repositorio GitHub y el directorio
# donde se publicarán los archivos Markdown.

github:
  organizacion: isc-despliegue

unidades:

  01:
    repositorio: despliegue_ud1
    rama: main
    mkdocs: mkdocs.yml
    guia: docs/1-guia.md
    introduccion: docs/2-introduccion.md
    entorno: docs/3-entorno.md
    conceptos:      
      directorio: docs/conceptos
    practicas:
